name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: MolWeigh-windows
          - os: macos-latest
            artifact_name: MolWeigh-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pyinstaller-hooks-contrib

      - name: Build Ketcher (bundled 2D editor)
        run: python scripts/build_ketcher.py

      - name: Run tests (core + Qt-independent modules)
        run: python -m pytest tests/test_calc.py tests/test_formula_parser.py tests/test_lineart_render.py tests/test_structure.py tests/test_schema.py tests/test_library_repo.py tests/test_template_repo.py tests/test_paths.py -q

      - name: Build with PyInstaller
        run: pyinstaller --clean --noconfirm molweigh.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/MolWeigh${{ matrix.os == 'macos-latest' && '.app' || '' }}
          if-no-files-found: error
